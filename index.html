
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>APES Prompt Generator Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --green:#6c8f7a;
  --blue:#5f7fa6;
  --gray:#eef2f0;
}

body {
  font-family: Arial;
  background: var(--gray);
  margin:0;
  padding:20px;
}

body.ada {
  background:#000;
  color:#fff;
}

.container {max-width:1000px;margin:auto;}

select,input,textarea {
  width:100%;
  margin:5px 0 15px;
  padding:8px;
}

button {
  background:var(--green);
  color:white;
  padding:8px;
  border:none;
  cursor:pointer;
}

.token {
  display:inline-block;
  background:var(--blue);
  color:white;
  padding:4px;
  margin:3px;
  border-radius:6px;
}

/* Focus accessibility */
button:focus, select:focus, textarea:focus {
  outline:3px solid orange;
}

/* Modal */
.modal {
  display:none;
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.6);
}

.modal-content{
  background:white;
  padding:20px;
  margin:10% auto;
  width:70%;
}

</style>
</head>

<body>
<div class="container">

<h2>APES Prompt Generator</h2>

<label>Paste Full CSV Dataset:</label>
<textarea id="csvInput" rows="5"></textarea>
<button onclick="parseCSV()">Load Dataset</button>

<label>Unit:</label>
<select id="unit"></select>

<label>Topic:</label>
<select id="topic"></select>

<label>Essential Knowledge:</label>
<div id="ekList"></div>

<button onclick="openModal()">Search All EK</button>

<div class="modal" id="modal">
<div class="modal-content">
<input id="searchBox" placeholder="Search EK">
<div id="results"></div>
<button onclick="closeModal()">Close</button>
</div>
</div>

<h3>Selected EK</h3>
<div id="selected"></div>

<label>Activity Types:</label>
<select id="activity" multiple>
<option>Interactive Learning</option>
<option>Case Study</option>
<option>Lab Investigation</option>
<option>FRQ Practice</option>
<option>Data Analysis</option>
<option>Argumentation (CER)</option>
<option>Diagram Analysis</option>
<option>Modeling</option>
<option>Policy Analysis</option>
<option>Socratic Seminar</option>
</select>

<label><input type="checkbox" id="ada" checked> ADA Mode</label>
<label><input type="checkbox" id="examples"> Analogies + Real-World</label>
<label><input type="checkbox" id="miscon" checked> Misconceptions</label>
<label><input type="checkbox" id="cross" checked> Cross-Unit Suggestions</label>

<label>Additional Parameters:</label>
<textarea id="params"></textarea>
<button onclick="ideaGen()">Generate Ideas</button>
<div id="ideaOut"></div>

<label>Difficulty:</label>
<select id="difficulty">
<option>AP Level</option>
<option>Scaffolded</option>
<option>Remediation</option>
</select>

<button onclick="generatePrompt()">Generate Prompt</button>
<button onclick="saveConfig()">Save</button>
<button onclick="loadConfig()">Load</button>
<button onclick="downloadPrompt()">Download</button>

<textarea id="output" rows="15"></textarea>

</div>

<script>

let data=[];
let selected=[];

/* ================= CSV PARSER ================= */
function parseCSV(){
  const lines=document.getElementById("csvInput").value.split("\n");
  const headers=lines[0].split(",");

  for(let i=1;i<lines.length;i++){
    let row=lines[i].split(",");
