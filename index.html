
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>APES Prompt Generator – Full Embedded</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --green:#6c8f7a;
  --blue:#5f7fa6;
  --gray:#eef2f0;
}

body {
  font-family: Arial;
  background: var(--gray);
  padding:20px;
}

body.ada {
  background:#000;
  color:#fff;
}

.container {max-width:1000px;margin:auto;}

select,input,textarea {
  width:100%;
  padding:8px;
  margin:5px 0 15px;
}

button {
  background:var(--green);
  color:white;
  padding:8px;
  border:none;
}

.token {
  display:inline-block;
  background:var(--blue);
  color:white;
  padding:4px;
  margin:3px;
  border-radius:6px;
}

.modal {
  display:none;
  position:fixed;
  background:rgba(0,0,0,.6);
  width:100%;
  height:100%;
}

.modal-content {
  background:white;
  padding:20px;
  margin:10% auto;
  width:70%;
}
</style>
</head>

<body>
<div class="container">

<h2>APES Prompt Generator</h2>

<label>Dataset:</label>
<select id="datasetChoice" onchange="chooseDataset()">
<option value="preloaded">APES + TEKS Embedded (Default)</option>
<option value="custom">Use Custom CSV</option>
</select>

<div id="csvSection" style="display:none;">
<textarea id="csvInput"></textarea>
<button onclick="parseCSV()">Load CSV</button>
</div>

<label>Unit:</label>
<select id="unit"></select>

<label>Topic:</label>
<select id="topic"></select>

<label>Essential Knowledge:</label>
<div id="ekList"></div>

<button onclick="openModal()">Search All EK</button>

<div class="modal" id="modal">
<div class="modal-content">
<input id="searchBox" placeholder="Search EK">
<div id="results"></div>
<button onclick="closeModal()">Close</button>
</div>
</div>

<h3>Selected EK</h3>
<div id="selected"></div>

<label>Activity:</label>
<select id="activity" multiple>
<option>Interactive</option>
<option>Case Study</option>
<option>Lab</option>
<option>FRQ</option>
<option>Data Analysis</option>
<option>Diagram Analysis</option>
<option>CER Writing</option>
</select>

<label><input type="checkbox" id="ada" checked> ADA Mode</label>
<label><input type="checkbox" id="examples"> Analogies</label>
<label><input type="checkbox" id="miscon" checked> Misconceptions</label>

<label>Parameters:</label>
<textarea id="params"></textarea>
<button onclick="ideaGen()">Generate Idea Prompts</button>

<div id="ideaOut"></div>

<label>Difficulty:</label>
<select id="difficulty">
<option>AP Level</option>
<option>Scaffolded</option>
<option>Remediation</option>
</select>

<button onclick="generatePrompt()">Generate Prompt</button>
<button onclick="downloadPrompt()">Download</button>

<textarea id="output" rows="15"></textarea>

</div>

<script>

/* ================= FULL DATASET (Expanded Sample) ================= */

const preloadedData = [
{
unit:"5",
topic:"5.5 Irrigation Methods",
ek:"Salinization occurs when salts in groundwater remain in the soil after water evaporates, making soil toxic to plants.",
verb:"Describe",
teks:"N/A"
},
{
unit:"5",
topic:"5.5 Irrigation Methods",
ek:"Flood irrigation involves flooding an agricultural field and can lead to waterlogging.",
verb:"Describe",
teks:"N/A"
},
{
unit:"1",
topic:"1.4 The Carbon Cycle",
ek:"The carbon cycle is the movement of carbon between sources and sinks.",
verb:"Explain",
teks:"B.13(C)"
},
{
unit:"2",
topic:"2.1 Introduction to Biodiversity",
ek:"Biodiversity includes genetic, species, and habitat diversity.",
verb:"Explain",
teks:"8.12(C)"
}
];

/* ================= STATE ================= */

let data = [];
let selected = [];

/* ================= DATA SWITCH ================= */

function chooseDataset(){
  if(datasetChoice.value==="preloaded"){
    data = [...preloadedData];
    csvSection.style.display="none";
    initUnits();
  } else {
    data=[];
    csvSection.style.display="block";
  }
}

window.onload = chooseDataset;

/* ================= FILTERING ================= */

function initUnits(){
  unit.innerHTML="";
  [...new Set(data.map(d=>d.unit))].forEach(u=>{
    let o=document.createElement("option");
    o.value=u;
    o.text="Unit "+u;
    unit.appendChild(o);
  });
}

unit.onchange=()=>{
  topic.innerHTML="";
  data.filter(d=>d.unit===unit.value)
      .map(d=>d.topic)
      .filter((v,i,a)=>a.indexOf(v)===i)
      .forEach(t=>{
        let o=document.createElement("option");
        o.value=t;
        o.text=t;
        topic.appendChild(o);
      });
};

topic.onchange=()=>{
  ekList.innerHTML="";
  data.filter(d=>d.topic===topic.value)
      .forEach(d=>{
        let cb=document.createElement("input");
        cb.type="checkbox";
        cb.onclick=()=>addEK(d);
        ekList.appendChild(cb);
        ekList.append(d.ek, document.createElement("br"));
      });
};

/* ================= SELECT ================= */

function addEK(d){
  selected.push(d);
  render();
}

function render(){
  selected.innerHTML="";
  selected.forEach(s=>{
    let span=document.createElement("span");
    span.className="token";
    span.textContent=s.ek;
    document.getElementById("selected").appendChild(span);
  });
}

/* ================= SEARCH ================= */

function openModal(){ modal.style.display="block"; }
function closeModal(){ modal.style.display="none"; }

searchBox.oninput=()=>{
  results.innerHTML="";
  data.filter(d=>d.ek.toLowerCase().includes(searchBox.value))
      .forEach(d=>{
        let b=document.createElement("button");
        b.innerText=d.ek;
        b.onclick=()=>addEK(d);
        results.appendChild(b);
      });
};

/* ================= IDEAS ================= */

function ideaGen(){
  ideaOut.innerHTML = `
  <ul>
    <li>Create FRQ based on selected EKs</li>
    <li>Design case study with ${params.value}</li>
    <li>Analyze environmental dataset</li>
  </ul>`;
}

/* ================= PROMPT ================= */

function generatePrompt(){

let verbs=[...new Set(selected.map(s=>s.verb))].join(", ");

let eks=selected.map(s=>"- "+s.ek).join("\n");

let teks=selected.map(s=>s.teks).join(", ");

output.value = `
You are an AP Environmental Science instructor.

Essential Knowledge:
${eks}

Students must:
${verbs}

Design a ${[...activity.selectedOptions].map(o=>o.value)} activity.

Requirements:
- Difficulty: ${difficulty.value}
- Include analogies: ${examples.checked}
- Address misconceptions: ${miscon.checked}

Previous Knowledge (TEKS):
${teks}

Additional:
${params.value}

Output:
- Engage, Explore, Explain, Elaborate, Evaluate (5E model)
- Include diagrams, case study, and AP FRQ

`;

if(ada.checked) document.body.classList.add("ada");

}

/* ================= DOWNLOAD ================= */

function downloadPrompt(){
  let blob=new Blob([output.value],{type:"text/plain"});
  let a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="APES_prompt.txt";
  a.click();
}

</script>
</body>
</html>
